plugins {
    id 'com.android.application'
}

def onnxRuntimeRoot = System.getenv('RPPG_ONNXRUNTIME_ANDROID')
if (onnxRuntimeRoot == null || onnxRuntimeRoot.isBlank()) {
    throw new GradleException(
            'RPPG_ONNXRUNTIME_ANDROID must point to onnxruntime-android-1.27.0')
}

android {
    namespace 'com.jagger.rppgbench'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.jagger.rppgbench'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.4.0-gated'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig false
    }

    sourceSets {
        main {
            jniLibs.srcDir file("${onnxRuntimeRoot}/jni")
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libonnxruntime4j_jni.so']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
