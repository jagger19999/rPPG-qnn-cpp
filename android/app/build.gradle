plugins {
    id 'com.android.application'
}

def onnxRuntimeRoot = System.getenv('RPPG_ONNXRUNTIME_ANDROID')
if (onnxRuntimeRoot == null || onnxRuntimeRoot.isBlank()) {
    throw new GradleException(
            'RPPG_ONNXRUNTIME_ANDROID must point to onnxruntime-android-1.27.0')
}

def sharedOrtThreads = project.findProperty('rppgOrtIntraOpThreads') ?:
        System.getenv('RPPG_ORT_INTRA_OP_THREADS')
def tscanOrtThreads = project.findProperty('rppgTscanOrtIntraOpThreads') ?:
        sharedOrtThreads ?: '2'
def efficientPhysOrtThreads =
        project.findProperty('rppgEfficientPhysOrtIntraOpThreads') ?:
        sharedOrtThreads ?: '2'
def supportedOrtThreads = ['2', '4', '6']
if (!supportedOrtThreads.contains(tscanOrtThreads.toString()) ||
        !supportedOrtThreads.contains(efficientPhysOrtThreads.toString())) {
    throw new GradleException('ORT intra-op threads must be 2, 4, or 6')
}

android {
    namespace 'com.jagger.rppgbench'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.jagger.rppgbench'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.5.1-traditional-diagnostics'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments "-DRPPG_TSCAN_ORT_INTRA_OP_THREADS=${tscanOrtThreads}",
                        "-DRPPG_EFFICIENTPHYS_ORT_INTRA_OP_THREADS=${efficientPhysOrtThreads}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig false
    }

    sourceSets {
        main {
            jniLibs.srcDir file("${onnxRuntimeRoot}/jni")
        }
    }

    packaging {
        jniLibs {
            excludes += ['**/libonnxruntime4j_jni.so']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
