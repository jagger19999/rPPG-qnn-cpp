<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e}
#chart{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="chart"></canvas>
<script>
(function(){
  const MAX_SEC = 60;
  const Y_MIN = 40, Y_MAX = 180;
  const COLORS = ['#378ADD','#7F77DD','#D85A30'];
  const LABELS = ['传统','深度','手表'];

  let data = [[],[],[]];
  let startTs = null;

  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }

  window.addEventListener('resize', resize);

  function draw(){
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if(w <= 0 || h <= 0) return;
    const pad = {top: 32, right: 16, bottom: 28, left: 40};
    const pw = w - pad.left - pad.right;
    const ph = h - pad.top - pad.bottom;

    ctx.clearRect(0,0,w,h);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0,0,w,h);

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 0.5;
    const ySteps = 5;
    for(let i = 0; i <= ySteps; i++){
      const y = pad.top + (ph * i / ySteps);
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      const val = Math.round(Y_MAX - (Y_MAX - Y_MIN) * i / ySteps);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(val, pad.left - 4, y + 3);
    }

    const xSteps = 6;
    for(let i = 0; i <= xSteps; i++){
      const x = pad.left + (pw * i / xSteps);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, h - pad.bottom);
      ctx.stroke();
      const sec = MAX_SEC - (MAX_SEC * i / xSteps);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(-sec + 's', x, h - pad.bottom + 14);
    }

    // Draw lines
    for(let series = 0; series < 3; series++){
      const pts = data[series];
      if(pts.length < 2) continue;
      ctx.strokeStyle = COLORS[series];
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      let first = true;
      for(let i = 0; i < pts.length; i++){
        const relSec = pts[i].t - (startTs || pts[0].t);
        const x = pad.left + (1 - relSec / MAX_SEC) * pw;
        const y = pad.top + ph * (1 - (pts[i].v - Y_MIN) / (Y_MAX - Y_MIN));
        if(first){ ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // Legend
    const lx = w - pad.right - 90;
    const ly = pad.top - 20;
    for(let i = 0; i < 3; i++){
      ctx.fillStyle = COLORS[i];
      ctx.fillRect(lx + i * 36, ly, 8, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(LABELS[i], lx + i * 36 + 10, ly + 8);
    }
  }

  window.addDataPoint = function(tradBpm, deepBpm, watchBpm, ts){
    const now = ts || Date.now() / 1000;
    if(startTs === null) startTs = now;

    const push = (arr, v) => {
      if(v !== null && isFinite(v) && v > 0){
        arr.push({t: now, v: v});
      }
    };

    push(data[0], tradBpm);
    push(data[1], deepBpm);
    push(data[2], watchBpm);

    // Prune old data
    for(let s = 0; s < 3; s++){
      while(data[s].length > 0 && now - data[s][0].t > MAX_SEC) data[s].shift();
    }

    draw();
  };

  resize();
})();
</script>
</body>
</html>
